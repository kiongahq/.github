name: Repository guardrails
on:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Validate workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Require immutable external actions and reusable workflows
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, sys, yaml
          errors = []
          files = list(pathlib.Path('.github/workflows').glob('*.yml'))
          files += list(pathlib.Path('.github/workflows').glob('*.yaml'))
          files += list(pathlib.Path('.').rglob('action.yml'))
          files += list(pathlib.Path('.').rglob('action.yaml'))
          for path in sorted(set(files)):
              data = yaml.safe_load(path.read_text())
              pending, visited = [data], set()
              while pending:
                  node = pending.pop()
                  if not isinstance(node, (dict, list)) or id(node) in visited:
                      continue
                  visited.add(id(node))
                  if isinstance(node, list):
                      pending.extend(node)
                      continue
                  pending.extend(node.values())
                  if 'uses' not in node:
                      continue
                  reference = node['uses']
                  if isinstance(reference, str) and reference.startswith('./'):
                      continue
                  if not isinstance(reference, str) or not re.fullmatch(r'[\w./-]+@[0-9a-f]{40}', reference):
                      errors.append(f'{path}: external uses must be pinned to a full commit SHA')
          print('\n'.join(errors) if errors else 'All external actions and reusable workflows are immutable.')
          sys.exit(bool(errors))
          PYCODE
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Scan complete repository history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Block new vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
