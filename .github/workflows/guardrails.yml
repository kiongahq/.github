name: Repository guardrails
on:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Validate workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Require immutable external actions and reusable workflows
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, sys
          errors = []
          for path in pathlib.Path('.github/workflows').glob('*'):
              if path.suffix not in ('.yaml', '.yml'):
                  continue
              for line, text in enumerate(path.read_text().splitlines(), 1):
                  match = re.match(r'\s*(?:-\s*)?uses:\s*[\"\']?([^\s\"\'#]+)', text)
                  if not match or match[1].startswith('./'):
                      continue
                  if not re.fullmatch(r'[\w./-]+@[0-9a-f]{40}', match[1]):
                      errors.append(f'{path}:{line}: external uses must be pinned to a full commit SHA')
          print('\n'.join(errors) if errors else 'All external actions and reusable workflows are immutable.')
          sys.exit(bool(errors))
          PYCODE
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Scan complete repository history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Block new vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
