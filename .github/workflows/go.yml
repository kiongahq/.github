name: Go

# Reusable Go checks for Kionga services:
#   jobs:
#     go:
#       uses: kiongahq/.github/.github/workflows/go.yml@main

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0               # gitleaks scans the full history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: gofmt
        run: gofmt -l . | tee /tmp/unformatted && test ! -s /tmp/unformatted
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      # Security gates. Reviewed false positives carry a "#nosec <rule> -- reason"
      # comment at the site; secrets in test fixtures go in .gitleaksignore.
      - name: govulncheck (fails on any reachable vulnerability)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=build -severity medium -confidence medium ./...
      - name: gitleaks (full history)
        working-directory: ${{ github.workspace }}
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
