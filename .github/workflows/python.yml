name: Python

# Reusable Python checks for Kionga components:
#   jobs:
#     python:
#       uses: kiongahq/.github/.github/workflows/python.yml@main
#       with:
#         install: pip install -e ".[dev]"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      install:
        description: Command that installs the component and its test dependencies
        type: string
        required: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0               # gitleaks scans the full history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
      - run: pip install "ruff>=0.5" "pytest>=8.0"
      - run: ruff check .
      - run: python -m pytest -q
      # Security gates. Reviewed bandit false positives carry "# nosec <rule>"
      # with a reason; secrets in test fixtures go in .gitleaksignore.
      - name: pip-audit (installed dependencies)
        run: |
          pip install --upgrade pip setuptools "pip-audit==2.10.1"
          pip-audit --skip-editable
      - name: bandit
        run: |
          pip install "bandit==1.9.4"
          bandit -q -r . -x ./tests,./.venv,./node_modules -ll
      - uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
