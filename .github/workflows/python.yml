name: Python

# Reusable Python checks for Kionga components:
#   jobs:
#     python:
#       uses: kiongahq/.github/.github/workflows/python.yml@main
#       with:
#         install: pip install -e ".[dev]"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      install:
        description: Command that installs the component and its test dependencies
        type: string
        required: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
      - run: pip install "ruff>=0.5" "pytest>=8.0"
      - run: ruff check .
      - run: python -m pytest -q
