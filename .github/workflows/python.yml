name: Python

# Reusable Python checks for Kionga components:
#   jobs:
#     python:
#       uses: kiongahq/.github/.github/workflows/python.yml@main
#       with:
#         install: pip install -e ".[dev]"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      install:
        description: Supported installation mode (pip install -r requirements-dev.txt or pip install -e ".[dev]")
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0               # gitleaks scans the full history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install project test dependencies
        env:
          INSTALL_MODE: ${{ inputs.install }}
        run: |
          case "$INSTALL_MODE" in
            'pip install -r requirements-dev.txt') pip install -r requirements-dev.txt ;;
            'pip install -e ".[dev]"') pip install -e ".[dev]" ;;
            *) echo "Unsupported dependency installation mode" >&2; exit 1 ;;
          esac
      - run: pip install "ruff>=0.5" "pytest>=8.0"
      - run: ruff check .
      - run: python -m pytest -q
      # Security gates. Reviewed bandit false positives carry "# nosec <rule>"
      # with a reason; secrets in test fixtures go in .gitleaksignore.
      - name: pip-audit (installed dependencies)
        run: |
          pip install --upgrade pip setuptools "pip-audit==2.10.1"
          pip-audit --skip-editable
      - name: bandit
        run: |
          pip install "bandit==1.9.4"
          bandit -q -r . -x ./tests,./.venv,./node_modules -ll
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: stable, cache: false}
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
