name: Image

# Development builds publish edge and SHA references. Published stable releases
# publish only their exact X.Y.Z version. Deployments should pin image digests.
# Release tags must resolve to reviewed default-branch commits.
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      build-args:
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=short,enable=${{ github.event_name != 'release' }}
            type=sha,format=long,enable=${{ github.event_name != 'release' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: false
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Summary
        env:
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE_NAME"
            echo "Digest: $IMAGE_DIGEST"
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Require releases to contain reviewed default-branch commits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            python3 - <<'PYCODE'
          import json, os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          version = pathlib.Path("version.txt").read_text().strip()
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag) or tag != "v" + version or version == "0.0.0":
              raise SystemExit("Release tag must match the reviewed version.txt")
          if json.loads(pathlib.Path(".release-please-manifest.json").read_text()) != {".": version}:
              raise SystemExit("Release manifest and version.txt must agree")
          if not re.search(r"^## \[?" + re.escape(version) + r"(?:\]|\s|$)", pathlib.Path("CHANGELOG.md").read_text(), re.MULTILINE):
              raise SystemExit("Release must have a changelog entry")
          PYCODE
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release image
        if: github.event_name == 'release'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:${TAG#v}" > /dev/null 2> "$RUNNER_TEMP/registry-error"; then
            echo "::error::This release image already exists. Rerun failed jobs only; never overwrite a release version."
            exit 1
          fi
          if ! grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/registry-error"; then
            cat "$RUNNER_TEMP/registry-error" >&2
            exit 1
          fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=short,enable=${{ github.event_name != 'release' }}
            type=sha,format=long,enable=${{ github.event_name != 'release' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Summary
        env:
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE_NAME"
            echo "Digest: $IMAGE_DIGEST"
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  record-release:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Attach the published digest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          IMAGE_NAME: ${{ inputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          record = {"image": os.environ["IMAGE"], "digest": os.environ["DIGEST"],
                    "tag": os.environ["TAG"], "commit": os.environ["GITHUB_SHA"]}
          pathlib.Path("image.json").write_text(json.dumps(record, indent=2) + "\n")
          PYCODE
          mv image.json "${IMAGE_NAME}-digest.json"
          gh release upload "$TAG" "${IMAGE_NAME}-digest.json" --repo "$GITHUB_REPOSITORY"
